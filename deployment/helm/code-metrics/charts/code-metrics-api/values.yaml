# Default values for code-metrics.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

mocks:
  enabled: true
  image:
    repository: ghcr.io/code-metrics-project/code-metrics-mocks
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  envVars:
    keyValues:
      IMPOSTER_CONFIG_SCAN_RECURSIVE: true
  resources: {}
  port: 8080
  securityContext: {}

application:
  image:
    repository: ghcr.io/code-metrics-project/code-metrics-api
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  envVars:
    templates: []
    secrets: {}
    keyValues:
      CORS_ORIGIN: https://code-metrics.localhost:3001
      AUTHENTICATOR_IMPL: file
      ACCESS_TOKEN_SECRET: changeme
      LOOKUP_CACHE_ENABLED: true
      DATASTORE_IMPL: inmem
      LOG_RESPONSE_BODY: false
      LOG_LEVEL: 1
      CONFIG_DIR: "/backend/.config"
      #COGNITO_USER_POOL_ID: changeme
      #COGNITO_CLIENT_ID: changeme
      #API_RETRY_LIMIT: 5
      #AWS_REGION: eu-west-1
      #DATABASE_NAME: code-metrics
      #DATABASE_URI: mongodb://code-metrics:changeme@localhost:27017
      #SECRET_RESOLVER_IMPL: file

  resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

auth:
  fromFile: true

secrets:
  # Users / usersSecretRef requires 'auth.fromFile' set to true
  users: []
  # - name: admin
  #   password: 1234
  #   salt: 12345
  # Use and existing secret
  userSecretRef: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

service:
  type: ClusterIP
  port: 3000

config:
  remoteConfig: {}
  workloadConfig: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: [ ]