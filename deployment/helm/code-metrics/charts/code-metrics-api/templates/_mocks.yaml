{{- define "code-metrics-api.mocks" -}}
- name: {{ .Chart.Name }}-mocks
  securityContext:
    {{- toYaml .Values.mocks.securityContext | nindent 12 }}
  image: "{{ .Values.mocks.image.repository }}:{{ .Values.mocks.image.tag | default .Chart.AppVersion }}"
  imagePullPolicy: {{ .Values.mocks.image.pullPolicy }}
  env:
  {{- range $key := .Values.mocks.envVars.templates }}
  - name: {{ $key }}
    value: {{ include $key $ }}
  {{- end }}
  {{- range $key, $val := .Values.mocks.envVars.keyValues }}
  - name: {{ $key }}
    value: {{ $val | quote }}
  {{- end }}
  {{- range $k, $v :=  .Values.mocks.envVars.secrets }}
  - name: {{ $k }}
    valueFrom:
      secretKeyRef:
        key: {{ $v.key }}
        name: {{ $v.name }}
  {{- end }}
  ports:
    - name: mock-http
      containerPort: {{ .Values.mocks.port }}
      protocol: TCP
  livenessProbe:
    httpGet:
      path: /system/status
      port: mock-http
  readinessProbe:
    httpGet:
      path: /system/status
      port: mock-http
  resources:
    {{- toYaml .Values.mocks.resources | nindent 12 }}
  {{- end -}}