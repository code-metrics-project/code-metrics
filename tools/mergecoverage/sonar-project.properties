# SonarQube Configuration for Merge Coverage Tool
# Node.js Utility

sonar.projectKey=code-metrics-tools-mergecoverage
sonar.projectName=CodeMetrics Tools - Merge Coverage

# Source configuration
sonar.sources=.
sonar.inclusions=*.js

# Exclusions
sonar.exclusions=**/node_modules/**,**/*.test.js,**/*.spec.js

# JavaScript coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
