# SonarQube Configuration for User Config Tool
# Go CLI Utility

sonar.projectKey=code-metrics-tools-userconfig
sonar.projectName=CodeMetrics Tools - User Config

# Source configuration
sonar.sources=.
sonar.inclusions=**/*.go

# Exclusions
sonar.exclusions=**/*_test.go,**/vendor/**

# Test configuration
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go coverage
sonar.go.coverage.reportPaths=coverage.out

# Encoding
sonar.sourceEncoding=UTF-8
