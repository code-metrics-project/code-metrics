---
workloads:
  - id: athena
    codeManagement:
      type: azure
      serverId: example-azure
      projectName: athena
      repoGroups:
        backend:
          components:
            - repo: /spring-.*/
        frontend:
          sonarTags:
            - fe
        platform:
          components:
            - repo: /.*_platform/
            - repo: /.*_infrastructure/
    codeAnalysis:
      type: sonar
      serverId: example-sonar
    projectManagement:
      type: jira
      serverId: example-jira
      teamFilterJql: '"Team name[Dropdown]" in ("Athena")'
repoMappings:
  - sonarProjectKey: petclinic
    vcsRepoName: spring-petclinic
