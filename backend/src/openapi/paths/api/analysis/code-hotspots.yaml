post:
  summary: Returns a list of files frequently changed in relation to project issues.
  description: Identifies code hotspots - files that are changed frequently when resolving issues.

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - workload
            - startDate
          properties:
            workload:
              type: string
            startDate:
              type: string
              format: date
              description: The start date for the analysis period (ISO 8601 format, e.g. "2025-12-15")
            issueTypes:
              type: array
              description: Optional list of issue types to filter by (e.g. ["Bug", "Defect"]). If not provided, defaults to the configured ticket types for the workload.
              items:
                type: string

  responses:
    "200":
      description: A list of code hotspot files
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                workloadId:
                  type: string
                componentName:
                  type: string
                repoName:
                  type: string
                pathData:
                  type: array
                  items:
                    type: object
                    properties:
                      count:
                        type: integer
                      coverage:
                        type: string
                      issueIds:
                        type: array
                        items:
                          type: string
                      path:
                        type: string

    "400":
      description: A bad request for code hotspots
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Error.yaml"
