---
version: "2.0"

codeAnalysis:
  sonar:
    servers:
      - id: example-sonar
        url: https://sonar.example.com
        apiKey: changeme
      - id: mock-sonar
        url: http://localhost:8080
        apiKey: ""
    tagKeyTypes:
      - backend
      - frontend
      - mobile
      - workload

codeManagement:
  azure:
    servers:
      - id: mock-azure
        url: http://localhost:8080
        apiKey: ""
        branches:
          - main
  bitbucketCloud:
    servers:
      - id: example-bitbucket-cloud
        url: "https://api.bitbucket.org/2.0"
        username: ""
        apiKey: ""
        branches:
          - main
  bitbucketServer:
    servers:
      - id: example-bitbucket-server
        url: "http://localhost:7990/rest"
        username: ""
        apiKey: ""
        branches:
          - main
  github:
    servers:
      # Example using Personal Access Token (Bearer Token) authentication
      - id: mock-github
        url: http://localhost:8080
        apiKey: ""
        authMethod: BEARER_TOKEN
        branches:
          - main
      # Example using GitHub App authentication (recommended for organizations)
      - id: example-github-app
        url: https://api.github.com
        authMethod: GITHUB_APP
        githubApp:
          appId: "${secret.GITHUB_APP_ID}"
          installationId: "${secret.GITHUB_APP_INSTALLATION_ID}"
          privateKey: "${secret.GITHUB_APP_PRIVATE_KEY}"
        branches:
          - main
          - develop
  gitlab:
    servers: []

pipelines:
  azure:
    servers:
      - id: mock-azure
        url: http://localhost:8080
        apiKey: ""
        branches:
          - main
  github:
    servers:
      # Example using Personal Access Token (Bearer Token) authentication
      - id: mock-github
        url: http://localhost:8080
        apiKey: ""
        authMethod: BEARER_TOKEN
        branches:
          - main
      # Example using GitHub App authentication (recommended for organizations)
      - id: example-github-app
        url: https://api.github.com
        authMethod: GITHUB_APP
        githubApp:
          appId: "${secret.GITHUB_APP_ID}"
          installationId: "${secret.GITHUB_APP_INSTALLATION_ID}"
          privateKey: "${secret.GITHUB_APP_PRIVATE_KEY}"
        branches:
          - main
          - develop
  jenkins:
    servers:
      - id: example-jenkins
        url: http://user:key@localhost:32769/
        branches:
          - main

ticketManagement:
  azure:
    servers:
      - id: example-azure
        url: https://dev.azure.com/example-azure-org
        apiKey: ""
        authMethod: BEARER_TOKEN
        project: Project Name
        defaults:
          ticketTypes:
            - Bug
            - Issue
          ticketPriorities:
            - 0
            - 1
            - 2
            - 3
            - 4
      - id: mock-azure
        url: http://localhost:8080
        apiKey: ""
        authMethod: BEARER_TOKEN
        defaults:
          ticketTypes:
            - Bug
          ticketPriorities:
            - 0
            - 1
            - 2
            - 3
            - 4
  github:
    servers:
      # Example using Personal Access Token (Bearer Token) authentication
      - id: mock-github
        url: http://localhost:8080
        apiKey: ""
        authMethod: BEARER_TOKEN
        defaults:
          owner: "mock-organization"
          repo: "mock-repo"
          ticketTypes:
            - Bug
            - Enhancement
            - Feature
          ticketPriorities:
            - High
            - Medium
            - Low
      # Example using GitHub App authentication (recommended for organizations)
      - id: example-github-app
        url: https://api.github.com
        authMethod: GITHUB_APP
        githubApp:
          appId: "${secret.GITHUB_APP_ID}"
          privateKey: "${secret.GITHUB_APP_PRIVATE_KEY}"
          installationId: "${secret.GITHUB_APP_INSTALLATION_ID}"
        defaults:
          owner: "example-organization"
          repo: "example-repo"
          ticketTypes:
            - Bug
            - Enhancement
            - Feature
          ticketPriorities:
            - High
            - Medium
            - Low
  jira:
    servers:
      - id: example-jira-1
        url: https://example-jira-1.atlassian.net
        email: user@example.co.uk
        apiKey: changeme
        authMethod: BASIC_AUTH
        defaults:
          ticketTypes:
            - Bug
          ticketPriorities:
            - Lowest
            - Low
            - Medium
            - High
            - Highest
      - id: example-jira-2
        url: https://example-jira-2.atlassian.net
        apiKey: changeme
        authMethod: BEARER_TOKEN
        defaults:
          ticketTypes:
            - Bug
          ticketPriorities:
            - Lowest
            - Low
            - Medium
            - High
            - Highest
      - id: mock-jira
        url: http://localhost:8080
        apiKey: "123"
        authMethod: BEARER_TOKEN
        defaults:
          ticketTypes:
            - Bug
            - DevBug
            - StaticBug
            - OpsBug
          ticketPriorities:
            - Lowest
            - Low
            - Medium
            - High
            - Highest
  servicenow:
    servers:
      - id: mock-servicenow
        url: http://localhost:8080
        apiKey: ""
        authMethod: CUSTOM
        defaults:
          ticketPriorities: ["1", "2", "3"]
          tableName: "incident"
          projectName: "L1 Support"

llm:
  # Type can be "claude" or "gemini" (only one provider can be configured at a time)
  type: claude
  claude:
    # Single server configuration for Claude
    server:
      id: example-claude
      # API endpoint (optional, defaults to https://api.anthropic.com)
      url: https://api.anthropic.com
      # Get your API key from: https://console.anthropic.com/
      apiKey: "${secret.ANTHROPIC_API_KEY}"
      # Optional: specify model (defaults to claude-sonnet-4-5-20250929)
      model: claude-sonnet-4-5-20250929
  # Alternative: Use Gemini instead of Claude
  # gemini:
  #   server:
  #     id: example-gemini
  #     # Get your API key from: https://aistudio.google.com/app/apikey
  #     apiKey: "${secret.GOOGLE_AI_API_KEY}"
  #     # Optional: specify model (defaults to gemini-1.5-flash)
  #     model: gemini-1.5-flash
