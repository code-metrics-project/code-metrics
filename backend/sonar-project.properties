# SonarQube Configuration for Backend
# Node.js/TypeScript Express Backend Service

sonar.projectKey=code-metrics-backend
sonar.projectName=CodeMetrics Backend

# Source configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage*/**,**/*.test.ts,**/*.spec.ts,**/lambda/**,**/public-keys/**

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage-be--unit/lcov.info,coverage-be--integration/lcov.info,coverage-be--slow/lcov.info,coverage-be--full/lcov.info
sonar.javascript.lcov.reportPaths=coverage-be--unit/lcov.info,coverage-be--integration/lcov.info,coverage-be--slow/lcov.info,coverage-be--full/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# ESLint report (if using sonar-scanner with eslint-formatter-sonarqube)
# sonar.eslint.reportPaths=eslint-report.json
