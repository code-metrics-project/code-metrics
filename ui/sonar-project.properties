# SonarQube Configuration for UI (Vue)
# Vue.js/TypeScript with Vite

sonar.projectKey=code-metrics-ui
sonar.projectName=CodeMetrics UI (Vue)

# Source configuration
sonar.sources=src
sonar.tests=src,__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.vue,**/*.spec.ts,**/*.spec.vue,__tests__/**

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.vue,**/*.spec.ts,**/*.spec.vue,**/coverage*/**,**/__tests__/**,**/public/**,**/files/**

# TypeScript/JavaScript coverage (includes unit tests and Cypress E2E coverage)
sonar.typescript.lcov.reportPaths=coverage-ui--unit/lcov.info,coverage-ui--e2e/lcov.info
sonar.javascript.lcov.reportPaths=coverage-ui--unit/lcov.info,coverage-ui--e2e/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# ESLint report (if using sonar-scanner with eslint-formatter-sonarqube)
# sonar.eslint.reportPaths=eslint-report.json

# Cypress E2E tests exclusion (test files excluded from coverage, but coverage data is included)
sonar.coverage.exclusions=**/__tests__/**,**/cypress/**
