<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="/favicon.png" />
    <title>CodeMetrics</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Open+Sans:100,300,400,500,700,900"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css"
    />
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but the app doesn't work properly without JavaScript
        enabled. Please enable it to continue.</strong
      >
    </noscript>
    <div id="app">
      <div class="navbar">
        <img
          class="logo"
          src="/assets/img/codemetrics_small_title.png"
          alt="Code Metrics logo"
        />
      </div>
      <div>
        <p class="body-text">Code Metrics is loading</p>
        <div class="loader"></div>
      </div>
      <style>
        body {
          margin: 0;
        }
        .navbar {
          height: 64px;
          background-color: rgba(0, 0, 0, 0.87);
        }
        .logo {
          width: 200px;
          display: inline;
          margin: 14px 0 8px 12px;
        }
        .body-text {
          text-align: center;
          font-family: Open Sans, sans-serif;
          font-size: 18px;
          margin-top: 32px;
        }
        .loader {
          margin: auto;
          border: 8px solid #eaf0f6;
          border-radius: 50%;
          border-top: 8px solid #4ba8aa;
          width: 32px;
          height: 32px;
          animation: spinner 4s linear infinite;
        }
        @keyframes spinner {
          0% {
            transform: rotate(0deg);
          }
          100% {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
