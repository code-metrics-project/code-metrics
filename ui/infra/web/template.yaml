AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: SAM template for deploying CodeMetrics Classic UI static web assets

Parameters:
  DomainName:
    Type: String
    Description: Domain name
  CloudFrontWebACL:
    Type: String
    Description: CloudFront Web ACL ARN (in us-east-1)

Resources:
  CFOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub "${DomainName} CloudFront OAI"

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DomainName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      AccessControl: Private
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Action: s3:GetObject
            Principal:
              CanonicalUser: !GetAtt CFOriginAccessIdentity.S3CanonicalUserId
            Resource: !Sub "arn:aws:s3:::${WebsiteBucket}/*"

  CFDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Distribution for ${DomainName}"
        HttpVersion: http2
        PriceClass: "PriceClass_All"
        WebACLId: !Ref CloudFrontWebACL
        DefaultRootObject: index.html
        Origins:
          - Id: !Sub "S3-${DomainName}"
            DomainName: !Sub "${DomainName}.s3-${AWS::Region}.amazonaws.com"
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CFOriginAccessIdentity}"
        DefaultCacheBehavior:
          TargetOriginId: !Sub "S3-${DomainName}"
          Compress: true
          MinTTL: 0
          MaxTTL: 60
          DefaultTTL: 60
          ForwardedValues:
            QueryString: false
            Headers:
              - Origin
            Cookies:
              Forward: none
          ViewerProtocolPolicy: allow-all
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /index.html
            ResponseCode: 200
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 200

Outputs:
  DistributionDomainName:
    Description: The URL of the CloudFront distribution
    Value: !GetAtt CFDistribution.DomainName
