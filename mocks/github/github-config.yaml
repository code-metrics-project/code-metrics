plugin: rest

resources:
  # Health check endpoint for connection checker
  - method: get
    path: /rate_limit
    response:
      statusCode: 200
      content: |
        {
          "resources": {
            "core": { "limit": 5000, "remaining": 5000, "reset": 0 }
          },
          "rate": { "limit": 5000, "remaining": 5000, "reset": 0 }
        }

  # GitHub App authentication endpoints
  - method: get
    path: /app
    response:
      scriptFile: GET-app-authenticated.js

  - method: post
    path: /app/installations/{installation_id}/access_tokens
    response:
      file: POST-access-tokens.json

  - method: get
    path: /installation/repositories
    response:
      scriptFile: GET-installation-repos.js

  # PAT authentication endpoints
  - method: get
    path: /orgs/{org}/issue-types
    response:
      scriptFile: GET-issue-types.js

  - method: get
    path: /orgs/{org}/repos
    queryParams:
      type: "all"
    response:
      scriptFile: GET-repos-paginated.js

  - method: get
    path: /orgs/{org}/repos
    response:
      file: GET-repos.json

  - method: get
    path: /orgs/{org}/repos
    queryParams:
      type: "private"
    response:
      content: "[]"

  - method: get
    path: /repos/{org}/{repo}
    response:
      content: repo.json

  - method: get
    path: /repos/{owner}/{repo}/commits
    response:
      scriptFile: GET-commits.js

  - method: get
    path: /repos/{owner}/{repo}/commits/{ref}
    response:
      file: GET-commit.json

  - method: get
    path: /repos/{owner}/{repo}/commits/{commit_sha}/pulls
    response:
      scriptFile: GET-commitPulls.js

  # Closed PR listing is used by PR Open Time + PR Size queries.
  # Keep existing static fixture for other /pulls consumers, but provide
  # a dedicated handler for `state=closed` so date-based queries always return data.
  - method: get
    path: /repos/{owner}/{repo}/pulls
    queryParams:
      state: "closed"
    response:
      scriptFile: GET-pullRequests-closed.js

  - method: get
    path: /repos/{owner}/{repo}/pulls
    response:
      scriptFile: GET-pullRequests.js

  # PR detail endpoint used by PR Size query (Octokit: pulls.get)
  - method: get
    path: /repos/{owner}/{repo}/pulls/{pull_number}
    response:
      scriptFile: GET-pullRequest.js

  - method: get
    path: /repos/{owner}/{repo}/pulls/{pull_number}/commits
    response:
      file: GET-pullRequestCommits.json

  - method: get
    path: /repos/{owner}/{repo}/pulls/{pullId}/files
    response:
      file: GET-files.json

  - method: get
    path: /repos/{owner}/{repo}/actions/workflows
    response:
      file: GET-workflows.json

  - method: get
    path: /repos/{owner}/{repo}/actions/runs
    response:
      scriptFile: GET-workflowRuns.js

  - method: get
    path: /repos/{owner}/{repo}/actions/runs/{run_id}
    response:
      scriptFile: GET-workflowRun.js

  - method: get
    path: /repos/{owner}/{repo}/actions/runs/{run_id}/timing
    response:
      file: GET-workflowTiming.json

  - method: get
    path: /repos/{owner}/{repo}/issues
    response:
      scriptFile: GET-issues.js

  - method: get
    path: /repos/{owner}/{repo}/issues/{issue_number}
    response:
      scriptFile: GET-issue.js

  - method: get
    path: /repos/{owner}/{repo}/contents/{filename}
    response:
      file: GET-contents.txt

  - method: get
    path: /repos/{owner}/{repo}/rulesets
    response:
      file: GET-rules.json

  - method: get
    path: /repos/{owner}/{repo}/rulesets/{rule}
    response:
      file: GET-rule.json

  - method: get
    path: /repos/{owner}/{repo}/branches/{branch}/protection
    response:
      file: GET-branch.json

  - method: get
    path: /repos/{owner}/{repo}/dependabot/alerts
    response:
      file: GET-dependabotAlerts.json
