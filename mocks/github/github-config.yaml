plugin: rest

resources:
  - method: get
    path: /orgs/{org}/repos
    queryParams:
      type: "public"
    response:
      file: repos.json

  - method: get
    path: /orgs/{org}/repos
    response:
      content: "[]"

  - method: get
    path: /repos/{org}/{repo}
    response:
      content: repo.json

  - method: get
    path: /repos/{owner}/{repo}/commits
    response:
      file: commits.json

  - method: get
    path: /repos/{owner}/{repo}/commits/{ref}
    response:
      file: commit.json

  - method: get
    path: /repos/{owner}/{repo}/commits/{commit_sha}/pulls
    response:
      file: commitPulls.json

  - method: get
    path: /repos/{owner}/{repo}/pulls
    response:
      file: pullRequests.json

  - method: get
    path: /repos/{owner}/{repo}/pulls/{pull_number}/commits
    response:
      file: pullRequestCommits.json

  - method: get
    path: /repos/{owner}/{repo}/pulls/{pullId}/files
    response:
      file: files.json

  - method: get
    path: /repos/{owner}/{repo}/actions/runs
    response:
      file: workflowRuns.json

  - method: get
    path: /repos/{owner}/{repo}/actions/runs/{run_id}
    response:
      file: workflowRun.json

  - method: get
    path: /repos/{owner}/{repo}/actions/runs/{run_id}/timing
    response:
      file: workflowTiming.json

  - method: get
    path: /repos/{owner}/{repo}/contents/{filename}
    response:
      file: contents.txt

  - method: get
    path: /repos/{owner}/{repo}/rulesets
    response:
      file: rules.json

  - method: get
    path: /repos/{owner}/{repo}/rulesets/{rule}
    response:
      file: rule.json

  - method: get
    path: /repos/{owner}/{repo}/branches/{branch}/protection
    response:
      file: branch.json

  - method: get
    path: /repos/{owner}/{repo}/dependabot/alerts
    response:
      file: dependabotAlerts.json
