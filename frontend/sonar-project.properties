# SonarQube Configuration for Frontend (React)
# React/TypeScript with Vite + Playwright

sonar.projectKey=code-metrics-frontend
sonar.projectName=CodeMetrics Frontend (React)

# Source configuration
sonar.sources=src
sonar.tests=src,__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,__tests__/**

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage*/**,**/__tests__/**,**/public/**,**/files/**

# TypeScript/JavaScript coverage (unit + Playwright e2e)
sonar.typescript.lcov.reportPaths=coverage-frontend--unit/lcov.info,coverage-frontend--e2e/lcov.info,coverage-frontend--keycloak/lcov.info,coverage-frontend--oidc/lcov.info
sonar.javascript.lcov.reportPaths=coverage-frontend--unit/lcov.info,coverage-frontend--e2e/lcov.info,coverage-frontend--keycloak/lcov.info,coverage-frontend--oidc/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# ESLint report (if using sonar-scanner with eslint-formatter-sonarqube)
# sonar.eslint.reportPaths=eslint-report.json

# Test files are excluded from coverage
sonar.coverage.exclusions=**/__tests__/**
