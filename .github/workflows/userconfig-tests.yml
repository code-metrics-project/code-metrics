name: Userconfig Tests

on:
  push:
    paths:
      - "tools/userconfig/**"
      - ".github/workflows/userconfig-tests.yml"
  pull_request:
    paths:
      - "tools/userconfig/**"
      - ".github/workflows/userconfig-tests.yml"

jobs:
  test:
    name: Test userconfig package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Run tests
        run: |
          cd tools/userconfig
          go test -v ./...
