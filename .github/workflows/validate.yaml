name: Validate
on:
  workflow_call:
    inputs:
      vars:
        required: true
        type: string

env:
  # prefer ipv4 stack (see https://nodejs.org/api/cli.html#--dns-result-orderorder)
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  build-backend:
    uses: ./.github/workflows/backend.yaml
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  build-frontend:
    uses: ./.github/workflows/frontend.yaml
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  build-helm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    if: ${{ fromJSON(inputs.vars).helmComponents != 0 || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Lint Helm Chart
        working-directory: deployment/helm/code-metrics
        run: |
          helm lint .
      - name: Render Helm Chart
        working-directory: deployment/helm/code-metrics
        run: |
          helm dependency update
          helm template .
      - name: Lint Demo Helm Chart
        working-directory: deployment/helm/code-metrics-demo
        run: |
          helm lint .
      - name: Render Demo Helm Chart
        working-directory: deployment/helm/code-metrics-demo
        run: |
          helm dependency update
          helm template .
      - name: Package Helm Chart
        working-directory: scripts
        run: ./package-helm-chart.sh "${{ fromJSON(inputs.vars).tag }}"
      - name: Upload Chart artifact
        uses: actions/upload-artifact@v7
        with:
          name: helm
          path: deployment/helm/dist
          retention-days: 1

  build-desktop:
    uses: ./.github/workflows/desktop.yaml
    needs: [build-frontend, build-backend]
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  validate-machine-learning:
    uses: ./.github/workflows/machine-learning.yaml
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  build-mcp:
    uses: ./.github/workflows/mcp.yaml
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  build-promosite:
    uses: ./.github/workflows/promosite.yaml
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  build-threatmodel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: ${{ fromJSON(inputs.vars).threatmodelComponents != 0 || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Markdown to PDF Deps
        run: |
          sudo apt update
          sudo apt install pandoc wkhtmltopdf
      - name: Generate PDF
        run: |
          make threatmodel
      - name: Upload ThreatModel artifact
        uses: actions/upload-artifact@v7
        with:
          name: threatmodel
          path: threatmodel/dist
          retention-days: 1

  test-e2e:
    needs: [build-backend, build-frontend]
    uses: ./.github/workflows/e2e.yaml
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  test-e2e-ui:
    # UI e2e regression job, intentionally separate from the shared e2e workflow.
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: ${{ always() && !failure() && !cancelled() && (fromJSON(inputs.vars).uiComponents != 0 || fromJSON(inputs.vars).backendComponents != 0 || fromJSON(inputs.vars).githubComponents != 0 || startsWith(github.ref, 'refs/tags/')) }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COVERAGE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "/backend/.nvmrc"
      - name: Restore backend node_modules cache
        id: cache-backend-nm-e2e-ui
        uses: actions/cache@v5
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-nm-${{ hashFiles('backend/package-lock.json') }}
      - name: Install backend dependencies
        if: steps.cache-backend-nm-e2e-ui.outputs.cache-hit != 'true'
        working-directory: backend
        run: npm ci
      - name: Restore UI node_modules cache
        id: cache-ui-nm-e2e
        uses: actions/cache@v5
        with:
          path: |
            ui/node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-ui-cypress-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ui-nm-${{ hashFiles('ui/package-lock.json') }}
      - name: Install UI dependencies
        if: steps.cache-ui-nm-e2e.outputs.cache-hit != 'true'
        working-directory: ui
        run: npm ci
      - name: Install Imposter
        uses: imposter-project/imposter-github-action/setup@v0.6.1
      - name: E2E test UI with mock backend
        env:
          MOCKS_PRINT_LOG_ON_CRASH: "true"
          MOCKS_VERBOSE: "false"
        working-directory: scripts
        run: ./validate-test_e2e_ui_mocks.sh --skip-install
      - name: Upload E2E test run generated media
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ui-test-media
          path: ui/__tests__/output
          retention-days: ${{ fromJSON(inputs.vars).coverageRetention }}
      - name: Upload E2E test coverage report files
        if: ${{ env.COVERAGE_ENABLED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ui--e2e
          path: ui/coverage-ui--e2e
          retention-days: ${{ fromJSON(inputs.vars).coverageRetention }}

  merge-test-reports:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, test-e2e, test-e2e-ui]
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "/tools/mergecoverage/.nvmrc"
      - name: Install tool dependencies
        working-directory: tools/mergecoverage
        run: npm ci
      - name: Download coverage artifacts from all previous test steps
        uses: actions/download-artifact@v8
        with:
          path: tools/mergecoverage/jsoncov
          pattern: coverage-*
      # Debug
      - run: ls -R ./tools/mergecoverage/jsoncov
      - name: Merge test results script and produce full coverage report
        working-directory: tools/mergecoverage
        run: "npm run merge-coverage-json -- ./jsoncov"
      - name: Upload merged report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-full-report
          path: tools/mergecoverage/coverage-json-merged

  on-failure:
    runs-on: ubuntu-latest
    needs:
      [
        validate-machine-learning,
        build-backend,
        build-frontend,
        build-desktop,
        build-helm,
        build-threatmodel,
        build-mcp,
        build-promosite,
        test-e2e,
        test-e2e-ui,
        merge-test-reports,
      ]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && failure() && !cancelled() }}
    steps:
      - name: Slack Failure Notification
        uses: slackapi/slack-github-action@v3
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL }}
          slack-message: "Release Build Failure (Validate): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
