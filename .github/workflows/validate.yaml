name: Validate
on:
  workflow_call:
    inputs:
      vars:
        required: true
        type: string

env:
  # prefer ipv4 stack (see https://nodejs.org/api/cli.html#--dns-result-orderorder)
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  build-backend:
    uses: ./.github/workflows/backend.yaml
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  build-frontend:
    uses: ./.github/workflows/frontend.yaml
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  build-helm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    if: ${{ fromJSON(inputs.vars).helmComponents != 0 || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint Helm Chart
        working-directory: helm/code-metrics
        run: |
          helm lint .
      - name: Render Helm Chart
        working-directory: helm/code-metrics
        run: |
          helm dependency update
          helm template .
      - name: Lint Demo Helm Chart
        working-directory: helm/code-metrics-demo
        run: |
          helm lint .
      - name: Render Demo Helm Chart
        working-directory: helm/code-metrics-demo
        run: |
          helm dependency update
          helm template .
      - name: Package Helm Chart
        working-directory: scripts
        run: ./package-helm-chart.sh "${{ fromJSON(inputs.vars).tag }}"
      - name: Upload Chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm
          path: helm/dist
          retention-days: 1

  build-desktop:
    uses: ./.github/workflows/desktop.yaml
    needs: [build-frontend, build-backend]
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  validate-machine-learning:
    uses: ./.github/workflows/machine-learning.yaml
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  build-mcp:
    uses: ./.github/workflows/mcp.yaml
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  build-promosite:
    uses: ./.github/workflows/promosite.yaml
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  build-threatmodel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: ${{ fromJSON(inputs.vars).threatmodelComponents != 0 || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Markdown to PDF Deps
        run: |
          sudo apt update
          sudo apt install pandoc wkhtmltopdf
      - name: Generate PDF
        run: |
          make threatmodel
      - name: Upload ThreatModel artifact
        uses: actions/upload-artifact@v4
        with:
          name: threatmodel
          path: threatmodel/dist
          retention-days: 1

  test-e2e:
    needs: [build-backend, build-frontend]
    uses: ./.github/workflows/e2e.yaml
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  merge-test-reports:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, test-e2e]
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: "/tools/mergecoverage/.nvmrc"
      - name: Install tool dependencies
        working-directory: tools/mergecoverage
        run: npm ci
      - name: Download coverage artifacts from all previous test steps
        uses: actions/download-artifact@v4
        with:
          path: tools/mergecoverage/jsoncov
          pattern: coverage-*
      # Debug
      - run: ls -R ./tools/mergecoverage/jsoncov
      - name: Merge test results script and produce full coverage report
        working-directory: tools/mergecoverage
        run: "npm run merge-coverage-json -- ./jsoncov"
      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-full-report
          path: tools/mergecoverage/coverage-json-merged

  on-failure:
    runs-on: ubuntu-latest
    needs:
      [
        validate-machine-learning,
        build-backend,
        build-frontend,
        build-desktop,
        build-helm,
        build-threatmodel,
        build-mcp,
        build-promosite,
        test-e2e,
        merge-test-reports,
      ]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && failure() && !cancelled() }}
    steps:
      - name: Slack Failure Notification
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL }}
          slack-message: "Release Build Failure (Validate): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
