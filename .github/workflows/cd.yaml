name: CD
on:
  workflow_call:
    inputs:
      vars:
        required: true
        type: string
    secrets:
      DOCKER_HUB_USERNAME:
        required: false
      DOCKER_HUB_ACCESS_TOKEN:
        required: false
jobs:
  docker:
    uses: ./.github/workflows/docker.yaml
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  publish-release:
    needs: [docker]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          writeToFile: false
          includeRefIssues: false
      - name: Fetch backend release artifact
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: backend/dist
      - name: Fetch UI release artifact
        uses: actions/download-artifact@v4
        with:
          name: ui
          path: ui/dist
      - name: Fetch chart release artifact
        uses: actions/download-artifact@v4
        with:
          name: helm
          path: helm/dist
      - name: Fetch threat model release artifact
        uses: actions/download-artifact@v4
        with:
          name: threatmodel
          path: threatmodel/dist
      - name: Zip release assets
        run: |
          mkdir -p dist
          pushd backend/dist
          zip -r ../../dist/backend.zip .
          popd
          pushd ui/dist
          zip -r ../../dist/ui.zip .
          popd
          pushd helm/dist
          mv *.tgz ../../dist/
          popd
          pushd threatmodel/dist
          zip -r ../../dist/threatmodel.zip .
          popd
          pushd backend/config
          zip -r ../../dist/config.zip \
            *.schema.json \
            validate-config.js \
            validate-config.sh \
            package.json \
            package-lock.json \
            README.md
          popd
          pushd dist
          ls -l
      - name: Create release
        uses: actions/github-script@v7
        env:
          CHANGES: "${{ steps.changelog.outputs.changes }}"
        with:
          script: |
            const changes = process.env.CHANGES;
            const script = require('./.github/release.js')
            await script({github, context}, changes);

  on-failure:
    runs-on: ubuntu-latest
    needs: [docker, publish-release]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && failure() && !cancelled() }}
    steps:
      - name: Slack Failure Notification
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL }}
          slack-message: "Release Build Failure (CD): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
