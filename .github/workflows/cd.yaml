name: CD
on:
  workflow_call:
    inputs:
      vars:
        required: true
        type: string
    secrets:
      DOCKER_HUB_USERNAME:
        required: false
      DOCKER_HUB_ACCESS_TOKEN:
        required: false
jobs:
  docker:
    uses: ./.github/workflows/docker.yaml
    with:
      vars: ${{ inputs.vars }}
    secrets: inherit

  publish-release:
    needs: [docker]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is required to fetch full history and all tags so that
      # the changelog script can walk commits between the previous and current tag.
      # Do not change this to a shallow clone (fetch-depth: 1) or omit fetch-depth.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate CHANGELOG
        id: changelog
        run: |
          CHANGES="$(./scripts/generate-changelog.sh ${{ github.ref_name }})"
          {
            echo 'changes<<EOF'
            echo "$CHANGES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Fetch backend release artifact
        uses: actions/download-artifact@v8
        with:
          name: backend
          path: backend/dist
      - name: Fetch UI release artifact
        uses: actions/download-artifact@v8
        with:
          name: ui
          path: ui/dist
      - name: Fetch frontend release artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: frontend/dist
      - name: Fetch chart release artifact
        uses: actions/download-artifact@v8
        with:
          name: helm
          path: deployment/helm/dist
      - name: Fetch threat model release artifact
        uses: actions/download-artifact@v8
        with:
          name: threatmodel
          path: threatmodel/dist
      - name: Fetch MCP release artifact
        uses: actions/download-artifact@v8
        with:
          name: mcp
          path: mcp/dist
      - name: Fetch promosite release artifact
        uses: actions/download-artifact@v8
        with:
          name: promosite
          path: promosite/dist
      - name: Zip release assets
        run: |
          mkdir -p dist
          pushd backend/dist
          zip -r ../../dist/backend.zip .
          popd
          pushd ui/dist
          zip -r ../../dist/ui.zip .
          popd
          pushd frontend/dist
          zip -r ../../dist/frontend.zip .
          popd
          pushd deployment/helm/dist
          mv *.tgz ../../../dist/
          popd
          pushd threatmodel/dist
          zip -r ../../dist/threatmodel.zip .
          popd
          pushd compose
          zip -r ../dist/compose.zip .
          popd
          pushd mcp/dist
          zip -r ../../dist/mcp.zip .
          popd
          pushd promosite/dist
          zip -r ../../dist/promosite.zip .
          popd
          pushd backend/config
          zip -r ../../dist/config.zip \
            examples \
            validator
          popd
          pushd dist
          ls -l
      - name: Create release
        uses: actions/github-script@v8
        env:
          CHANGES: "${{ steps.changelog.outputs.changes }}"
        with:
          script: |
            const changes = process.env.CHANGES;
            const script = require('./.github/release.js')
            await script({github, context}, changes);

  on-failure:
    runs-on: ubuntu-latest
    needs: [docker, publish-release]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && failure() && !cancelled() }}
    steps:
      - name: Slack Failure Notification
        uses: slackapi/slack-github-action@v3
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL }}
          slack-message: "Release Build Failure (CD): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
