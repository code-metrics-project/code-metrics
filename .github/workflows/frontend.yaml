name: Frontend
on:
  workflow_call:
    inputs:
      vars:
        required: true
        type: string
jobs:
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    if: ${{ fromJSON(inputs.vars).uiComponents != 0 || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "/ui/.nvmrc"
      - name: Cache UI node_modules
        id: cache-ui-nm
        uses: actions/cache@v4
        with:
          path: ui/node_modules
          key: ${{ runner.os }}-ui-nm-${{ hashFiles('ui/package-lock.json') }}
      - name: Install UI dependencies
        if: steps.cache-ui-nm.outputs.cache-hit != 'true'
        working-directory: ui
        run: npm ci
      - name: Unit test UI
        working-directory: ui
        run: npm run test:unit:coverage
      - name: Upload UI unit test coverage report files
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui--unit
          path: ui/coverage-ui--unit
          retention-days: ${{ fromJSON(inputs.vars).coverageRetention }}

  build-frontend:
    runs-on: ubuntu-latest
    needs: test-frontend
    timeout-minutes: 12
    permissions:
      contents: read
    if: ${{ fromJSON(inputs.vars).uiComponents != 0 || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "/ui/.nvmrc"
      - name: Cache UI node_modules
        id: cache-ui-nm
        uses: actions/cache@v4
        with:
          path: ui/node_modules
          key: ${{ runner.os }}-ui-nm-${{ hashFiles('ui/package-lock.json') }}
      - name: Install UI dependencies
        if: steps.cache-ui-nm.outputs.cache-hit != 'true'
        working-directory: ui
        run: npm ci
      - name: Build UI
        working-directory: ui
        run: npm run build
      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui
          path: ui/dist
          retention-days: 1
