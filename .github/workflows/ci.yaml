name: CI
on: [push]
jobs:
  setvars:
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.vars.outputs.push }}
      tag: ${{ steps.vars.outputs.tag }}
      coverageRetention: ${{ steps.vars.outputs.coverageRetention }}
      machinelearningComponents: ${{ steps.vars.outputs.machinelearningComponents }}
      helmComponents: ${{ steps.vars.outputs.helmComponents }}
      uiComponents: ${{ steps.vars.outputs.uiComponents }}
      backendComponents: ${{ steps.vars.outputs.backendComponents }}
      threatmodelComponents: ${{ steps.vars.outputs.threatmodelComponents }}
      examplesComponents: ${{ steps.vars.outputs.examplesComponents }}
      githubComponents: ${{ steps.vars.outputs.githubComponents }}
      desktopComponents: ${{ steps.vars.outputs.desktopComponents }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Set release vars
        id: vars
        run: |
          if [[ "${{ github.ref }}" == 'refs/tags/'* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "push=true" >> $GITHUB_OUTPUT
            echo "coverageRetention=90" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "push=false" >> $GITHUB_OUTPUT
            echo "coverageRetention=1" >> $GITHUB_OUTPUT
          fi

          TRIGGER_DIRS=(
            ".github"
            "machinelearning"
            "helm"
            "ui"
            "backend"
            "threatmodel"
            "examples"
            "mocks"
            "desktop"
          )
          for i in "${TRIGGER_DIRS[@]}"; do
            count=$(git diff --name-only $(git describe --tags --abbrev=0) HEAD -- ${i} | cut -d/ -f1 | grep -v ' ' | sort | uniq | wc -l)
            # Ensure that the count is a proper integer
            if [[ -z "$count" ]]; then count=0; fi
            if [[ "${i:0:1}" == "."  ]]; then i=${i:1}; fi
            if [[ "${i}" == "mocks" ]]; then i="backend"; fi
            echo "${i}Components=${count}" >> $GITHUB_OUTPUT
          done;

  validate-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [setvars]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node (backend)
        uses: actions/setup-node@v4
        with:
          node-version-file: '/backend/.nvmrc'
      - name: Install backend config dependencies
        working-directory: backend/config
        run: npm install
      - name: Validate mock config
        run: ./mocks/validate-mock-config.sh

  validate:
    needs: [setvars, validate-config]
    uses: ./.github/workflows/validate.yaml
    with:
      tag: ${{ needs.setvars.outputs.tag }}
      coverageRetention: ${{ needs.setvars.outputs.coverageRetention }}
      machinelearningComponents: ${{ needs.setvars.outputs.machinelearningComponents }}
      helmComponents: ${{ needs.setvars.outputs.helmComponents }}
      uiComponents: ${{ needs.setvars.outputs.uiComponents }}
      backendComponents: ${{ needs.setvars.outputs.backendComponents }}
      threatmodelComponents: ${{ needs.setvars.outputs.threatmodelComponents }}
      examplesComponents: ${{  needs.setvars.outputs.examplesComponents }}
      githubComponents: ${{ needs.setvars.outputs.githubComponents }}
      desktopComponents: ${{ needs.setvars.outputs.desktopComponents }}
  cd:
    needs: [setvars, validate-config, validate]
    uses: ./.github/workflows/cd.yaml
    with:
      tag: ${{ needs.setvars.outputs.tag }}
      push: ${{ needs.setvars.outputs.push }}
      machinelearningComponents: ${{ needs.setvars.outputs.machinelearningComponents }}
      helmComponents: ${{ needs.setvars.outputs.helmComponents }}
      uiComponents: ${{ needs.setvars.outputs.uiComponents }}
      backendComponents: ${{ needs.setvars.outputs.backendComponents }}
      threatmodelComponents: ${{ needs.setvars.outputs.threatmodelComponents }}
      examplesComponents: ${{  needs.setvars.outputs.examplesComponents }}
      githubComponents: ${{ needs.setvars.outputs.githubComponents }}
      desktopComponents: ${{ needs.setvars.outputs.desktopComponents }}
    secrets: inherit
