name: CI
on: [push]
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      vars: ${{ steps.playwright.outputs.vars }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set vars (Python)
        id: vars
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ALL_FLAG="--all"
          else
            ALL_FLAG=""
          fi
          if [ "$GITHUB_REPOSITORY" = "DeloitteDigitalUK/code-metrics" ]; then
            python3 ./.github/set_vars.py --verbose "${ALL_FLAG}"
          else
            python3 ./.github/set_vars.py --verbose "${ALL_FLAG}" \
              --set auth=false \
              --set desktop=false \
              --set helm=false \
              --set machinelearning=false \
              --set mcp=false \
              --set promosite=false \
              --set run_docker_builds=false \
              --set threatmodel=false
          fi

      - name: Add Desktop Matrix
        id: desktop
        run: |
          VARS='${{ steps.vars.outputs.vars }}'

          # Call Python script
          MATRIX=$(python3 ./.github/generate_matrix.py --type desktop --vars "$VARS")

          # Inject into VARS
          NEW_VARS=$(echo "$VARS" | jq -c --argjson dm "$MATRIX" '. + {desktopMatrix: $dm}')
          echo "vars=$NEW_VARS" >> $GITHUB_OUTPUT

      - name: Add Docker Matrix
        id: docker
        run: |
          VARS='${{ steps.desktop.outputs.vars }}'

          # Call Python script
          MATRIX=$(python3 ./.github/generate_matrix.py --type docker --vars "$VARS")

          # Inject into VARS
          NEW_VARS=$(echo "$VARS" | jq -c --argjson dkm "$MATRIX" '. + {dockerMatrix: $dkm}')
          echo "vars=$NEW_VARS" >> $GITHUB_OUTPUT

      - name: Add Playwright container image
        id: playwright
        run: |
          VARS='${{ steps.docker.outputs.vars }}'
          IMAGE="$(python3 ./.github/resolve_playwright_container.py frontend/package.json frontend/bun.lock)"
          NEW_VARS=$(echo "$VARS" | jq -c --arg image "$IMAGE" '. + {playwrightContainerImage: $image}')
          echo "vars=$NEW_VARS" >> $GITHUB_OUTPUT

      - name: Setup Node (backend)
        uses: actions/setup-node@v6
        with:
          node-version-file: "/backend/.nvmrc"
      - name: Install backend config dependencies
        working-directory: backend/config/validator
        run: npm install
      - name: Validate mock config
        working-directory: mocks
        run: ./validate-mock-config.sh
      - name: Validate example config
        working-directory: backend/config/validator
        run: ./validate-config.sh ../examples

  validate:
    needs: [setup]
    uses: ./.github/workflows/validate.yaml
    with:
      vars: ${{ needs.setup.outputs.vars }}

  cd:
    needs: [setup, validate]
    if: ${{ always() && !failure() && !cancelled() }}
    uses: ./.github/workflows/cd.yaml
    with:
      vars: ${{ needs.setup.outputs.vars }}
    secrets: inherit

  # Always-on merge gate for branch rulesets / auto-merge. Do not skip this job when
  # dependencies fail — skipped required checks count as success. Fail in the step instead.
  ci-success:
    name: CI Success
    needs: [setup, validate, cd]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI jobs succeeded
        run: |
          echo "setup=${{ needs.setup.result }}"
          echo "validate=${{ needs.validate.result }}"
          echo "cd=${{ needs.cd.result }}"

          if [[ "${{ needs.setup.result }}" != "success" ]]; then
            echo "::error::setup did not succeed (${{ needs.setup.result }})"
            exit 1
          fi
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "::error::validate did not succeed (${{ needs.validate.result }})"
            exit 1
          fi
          # cd is skipped when setup/validate failed (handled above). Otherwise it must pass.
          if [[ "${{ needs.cd.result }}" != "success" ]]; then
            echo "::error::cd did not succeed (${{ needs.cd.result }})"
            exit 1
          fi
