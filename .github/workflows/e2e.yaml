name: E2E
on:
  workflow_call:
    inputs:
      vars:
        required: true
        type: string

jobs:
  test-oidc:
    runs-on: ubuntu-latest
    container:
      image: ${{ fromJSON(inputs.vars).playwrightContainerImage }}
    if: ${{ fromJSON(inputs.vars).authComponents != 0 || startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COVERAGE_ENABLED: "false"
      COVERAGE_PROFILE: "oidc"
      TMPDIR: /github/home/tmp
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y unzip lsof
          mkdir -p "$TMPDIR" "$HOME/.imposter"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "/backend/.nvmrc"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Setup Imposter
        uses: imposter-project/imposter-github-action/setup@v0.6.1

      - name: Restore backend node_modules cache
        id: cache-backend-nm-oidc
        uses: actions/cache@v6
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-nm-${{ hashFiles('backend/package-lock.json') }}
      - name: Install Backend Dependencies
        if: steps.cache-backend-nm-oidc.outputs.cache-hit != 'true'
        working-directory: ./backend
        run: npm ci

      - name: Restore Frontend node_modules cache
        id: cache-frontend-nm-oidc
        uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-frontend-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-bun-${{ hashFiles('frontend/bun.lock') }}
      - name: Install Frontend Dependencies
        if: steps.cache-frontend-nm-oidc.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Run Playwright Tests (OIDC)
        working-directory: ./scripts
        run: ./validate-test_e2e_mocks.sh --auth-mode oidc --skip-install

      - name: Upload OIDC test coverage report files
        if: ${{ env.COVERAGE_ENABLED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend--oidc
          path: frontend/coverage-frontend--oidc
          retention-days: ${{ fromJSON(inputs.vars).coverageRetention }}

      - name: Collect Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-oidc-artifacts
          path: |
            frontend/__tests__/output
            backend/logs
          if-no-files-found: ignore

  test-keycloak:
    runs-on: ubuntu-latest
    if: ${{ fromJSON(inputs.vars).authComponents != 0 || startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COVERAGE_ENABLED: "false"
      COVERAGE_PROFILE: "keycloak"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "/backend/.nvmrc"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Setup Imposter
        uses: imposter-project/imposter-github-action/setup@v0.6.1

      - name: Restore backend node_modules cache
        id: cache-backend-nm-keycloak
        uses: actions/cache@v6
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-nm-${{ hashFiles('backend/package-lock.json') }}

      - name: Install Backend Dependencies
        if: steps.cache-backend-nm-keycloak.outputs.cache-hit != 'true'
        working-directory: ./backend
        run: npm ci

      - name: Restore Frontend node_modules cache
        id: cache-frontend-nm-keycloak
        uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-frontend-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Frontend Dependencies
        if: steps.cache-frontend-nm-keycloak.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Verify system Chrome
        run: google-chrome --version

      - name: Run Playwright Tests (Keycloak)
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        working-directory: ./scripts
        run: ./validate-test_e2e_mocks.sh --auth-mode keycloak --skip-install

      - name: Upload Keycloak test coverage report files
        if: ${{ env.COVERAGE_ENABLED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend--keycloak
          path: frontend/coverage-frontend--keycloak
          retention-days: ${{ fromJSON(inputs.vars).coverageRetention }}

      - name: Collect Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-keycloak-artifacts
          path: |
            frontend/__tests__/output
            backend/logs
          if-no-files-found: ignore

  test-e2e:
    name: E2E Tests (Shard ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    container:
      image: ${{ fromJSON(inputs.vars).playwrightContainerImage }}
    if: ${{ always() && !failure() && !cancelled() && (fromJSON(inputs.vars).frontendComponents != 0 || fromJSON(inputs.vars).backendComponents != 0 || fromJSON(inputs.vars).githubComponents != 0 || startsWith(github.ref, 'refs/tags/')) }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      COVERAGE_ENABLED: "false"
      COVERAGE_PROFILE: "e2e"
      PLAYWRIGHT_BLOB_REPORT: "true"
      TMPDIR: /github/home/tmp
    steps:
      - uses: actions/checkout@v7

      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y unzip lsof
          mkdir -p "$TMPDIR" "$HOME/.imposter"

      - uses: actions/setup-node@v6
        with:
          node-version-file: "/backend/.nvmrc"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install Imposter
        uses: imposter-project/imposter-github-action/setup@v0.6.1

      - name: Restore backend node_modules cache
        id: cache-backend-nm-e2e
        uses: actions/cache@v6
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-nm-${{ hashFiles('backend/package-lock.json') }}

      - name: Install backend dependencies
        if: steps.cache-backend-nm-e2e.outputs.cache-hit != 'true'
        working-directory: backend
        run: npm ci

      - name: Restore Frontend node_modules cache
        id: cache-frontend-nm-e2e
        uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-frontend-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Frontend Dependencies
        if: steps.cache-frontend-nm-e2e.outputs.cache-hit != 'true'
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: E2E test frontend with mock backend (shard ${{ matrix.shard }}/5)
        env:
          MOCKS_PRINT_LOG_ON_CRASH: "true"
          MOCKS_VERBOSE: "false"
        working-directory: scripts
        run: ./validate-test_e2e_mocks.sh --auth-mode file --skip-install --shard ${{ matrix.shard }}/5

      - name: Upload Playwright blob report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: frontend/blob-report/
          retention-days: ${{ fromJSON(inputs.vars).coverageRetention }}

      - name: Upload E2E test coverage report files
        if: ${{ env.COVERAGE_ENABLED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend--e2e-shard-${{ matrix.shard }}
          path: frontend/coverage-frontend--e2e
          retention-days: ${{ fromJSON(inputs.vars).coverageRetention }}

      - name: Collect Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-e2e-shard-${{ matrix.shard }}-artifacts
          path: |
            frontend/__tests__/output
            backend/logs
          if-no-files-found: ignore

  e2e-merge-report:
    name: E2E Tests (Merge Reports)
    runs-on: ubuntu-latest
    needs: [test-e2e]
    if: ${{ always() && !cancelled() && (fromJSON(inputs.vars).frontendComponents != 0 || fromJSON(inputs.vars).backendComponents != 0 || fromJSON(inputs.vars).githubComponents != 0 || startsWith(github.ref, 'refs/tags/')) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: "/frontend/.nvmrc"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Restore Frontend node_modules cache
        id: cache-frontend-nm-e2e-merge
        uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-frontend-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Frontend Dependencies
        if: steps.cache-frontend-nm-e2e-merge.outputs.cache-hit != 'true'
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Download Playwright blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-*
          path: frontend/all-blob-reports/
          merge-multiple: true

      - name: Merge Playwright reports
        working-directory: frontend
        run: bun run playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged E2E test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-media
          path: frontend/playwright-report/
          retention-days: ${{ fromJSON(inputs.vars).coverageRetention }}

      - name: Fail if any E2E shard failed
        if: ${{ needs.test-e2e.result != 'success' }}
        run: |
          echo "One or more E2E shards failed. See the shard jobs for details."
          exit 1
