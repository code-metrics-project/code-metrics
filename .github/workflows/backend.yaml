name: Backend
on:
  workflow_call:
    inputs:
      vars:
        required: true
        type: string

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    if: ${{ fromJSON(inputs.vars).backendComponents != 0 || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "/backend/.nvmrc"
      - name: Cache backend node_modules
        id: cache-backend-nm
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-nm-${{ hashFiles('backend/package-lock.json') }}
      - name: Install backend dependencies
        if: steps.cache-backend-nm.outputs.cache-hit != 'true'
        working-directory: backend
        run: npm ci
      - name: Install Imposter
        uses: imposter-project/imposter-github-action/setup@v0.6.1
      - name: Copy dummy config for testing
        working-directory: backend
        run: |
          cp .env.template .env
          cp config/examples/remote-config.yaml remote-config.yaml
          cp config/examples/users.json users.json
          cp config/examples/workload-config.yaml workload-config.yaml
          cp config/examples/secrets.yaml.example secrets.yaml
      - name: Unit test backend + output coverage
        working-directory: backend
        env:
          COVERAGE_ENABLED: "false"
        run: npm test
      - name: Upload Backend unit test coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-be--unit
          path: backend/coverage-be--unit
          retention-days: ${{ fromJSON(inputs.vars).coverageRetention }}

  backend-build:
    runs-on: ubuntu-latest
    needs: test-backend
    timeout-minutes: 12
    permissions:
      contents: read
    if: ${{ fromJSON(inputs.vars).backendComponents != 0 || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "/backend/.nvmrc"
      - name: Cache backend node_modules
        id: cache-backend-nm
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-nm-${{ hashFiles('backend/package-lock.json') }}
      - name: Install backend dependencies
        if: steps.cache-backend-nm.outputs.cache-hit != 'true'
        working-directory: backend
        run: npm ci
      - name: Build backend
        working-directory: backend
        run: npm run release
      - name: Copy dummy config for release
        working-directory: backend
        run: |
          cp .env.template dist/.env
          mkdir -p dist/config
          cp config/examples/dashboard-config.json dist/config/dashboard-config.json
          cp config/examples/queries-config.json dist/config/queries-config.json
          cp config/examples/remote-config.yaml dist/config/remote-config.yaml
          cp config/examples/users.json dist/config/users.json
          cp config/examples/workload-config.yaml dist/config/workload-config.yaml
          cp config/examples/secrets.yaml.example dist/config/secrets.yaml
      - name: Upload built backend app artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend/dist
          retention-days: 1

  test-backend-slowtest:
    runs-on: ubuntu-latest
    needs: test-backend
    timeout-minutes: 12
    permissions:
      contents: read
    if: ${{ fromJSON(inputs.vars).backendComponents != 0 || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "/backend/.nvmrc"
      - name: Restore backend node_modules cache
        id: cache-backend-nm-slow
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-nm-${{ hashFiles('backend/package-lock.json') }}
      - name: Install backend dependencies
        if: steps.cache-backend-nm-slow.outputs.cache-hit != 'true'
        working-directory: backend
        run: npm ci
      - name: Install Imposter
        uses: imposter-project/imposter-github-action/setup@v0.6.1
      - name: Copy dummy config for testing
        working-directory: backend
        run: |
          cp .env.template .env
          cp config/examples/remote-config.yaml remote-config.yaml
          cp config/examples/users.json users.json
          cp config/examples/workload-config.yaml workload-config.yaml
          cp config/examples/secrets.yaml.example secrets.yaml
      - name: Run slow backend tests + output coverage
        working-directory: backend
        env:
          COVERAGE_ENABLED: "false"
        run: "npm run test:slow"
      - name: Upload Backend 'slow' Coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-be--slow
          path: backend/coverage-be--slow
          retention-days: ${{ fromJSON(inputs.vars).coverageRetention }}

  test-backend-integration:
    runs-on: ubuntu-latest
    needs: test-backend
    timeout-minutes: 12
    permissions:
      contents: read
    if: ${{ fromJSON(inputs.vars).backendComponents != 0 || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "/backend/.nvmrc"
      - name: Restore backend node_modules cache
        id: cache-backend-nm-int
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-nm-${{ hashFiles('backend/package-lock.json') }}
      - name: Install backend dependencies
        if: steps.cache-backend-nm-int.outputs.cache-hit != 'true'
        working-directory: backend
        run: npm ci
      - name: Install Imposter
        uses: imposter-project/imposter-github-action/setup@v0.6.1
      - name: Copy dummy config for testing
        working-directory: backend
        run: |
          cp .env.template .env
          cp config/examples/remote-config.yaml remote-config.yaml
          cp config/examples/users.json users.json
          cp config/examples/workload-config.yaml workload-config.yaml
          cp config/examples/secrets.yaml.example secrets.yaml
      - name: Integration test backend + output coverage
        working-directory: backend
        env:
          COVERAGE_ENABLED: "false"
          MOCKS_PRINT_LOG_ON_CRASH: "true"
          MOCKS_VERBOSE: "false"
        run: "npm run test:integration"
      - name: Upload Backend integration test coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-be--integration
          path: backend/coverage-be--integration
          retention-days: ${{ fromJSON(inputs.vars).coverageRetention }}
