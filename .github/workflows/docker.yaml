name: Docker
on:
  workflow_call:
    inputs:
      vars:
        required: true
        type: string
    secrets:
      DOCKER_HUB_USERNAME:
        required: false
      DOCKER_HUB_ACCESS_TOKEN:
        required: false
jobs:
  build-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ fromJSON(inputs.vars).dockerMatrix[0] != null }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.vars).dockerMatrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - name: Log in to DockerHub
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.actor != 'dependabot[bot]' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: downcase REPO Owner
        run: |
          REPO="${{ github.repository_owner }}"
          REPO="${REPO,,}"
          echo "REPO=${REPO}" >> ${GITHUB_ENV}
          echo "${REPO}"
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          file: ${{ github.workspace }}/${{ matrix.file }}
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ fromJSON(inputs.vars).push }}
          tags: |
            ghcr.io/deloittedigitaluk/${{ matrix.imageName }}:${{ fromJSON(inputs.vars).tag }}
            ghcr.io/deloittedigitaluk/${{ matrix.imageName }}:latest
            ${{ matrix.isJenkins && format('deloittedigitaluk/{0}:{1}', matrix.imageName, fromJSON(inputs.vars).tag) || '' }}
            ${{ matrix.isJenkins && format('deloittedigitaluk/{0}:latest', matrix.imageName) || '' }}
          build-args: |
            ${{ matrix.buildArgs }}
          cache-from: ${{ matrix.cacheMode != 'none' && 'type=gha' || '' }}
          cache-to: ${{ matrix.cacheMode != 'none' && format('type=gha,mode={0}', matrix.cacheMode) || '' }}
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
