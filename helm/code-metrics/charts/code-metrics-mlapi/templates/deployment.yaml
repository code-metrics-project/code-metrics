apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "code-metrics-mlapi.fullname" . }}
  labels:
    {{- include "code-metrics-mlapi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "code-metrics-mlapi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "code-metrics-mlapi.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "code-metrics-mlapi.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      {{- include "code-metrics-mlapi.application" . | nindent 6 }}
      volumes:
      - name: config-volume
        projected:
          sources:
            - configMap:
                name: {{ include "code-metrics-mlapi.fullname" . }}

